<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson | LearnSphere</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-content">
            <a href="index.html" class="logo">Learn<span>Sphere</span></a>
            <nav class="main-nav">
                <a href="pathways.html">Pathways</a>
                <a href="quizzes.html">Quizzes</a>
            </nav>
            <a href="login.html" class="header-button">Log in</a>
        </div>
    </header>

    <main class="legal-page">
        <div class="container legal-card">
            <h1 id="lessonTitle">Loading...</h1>
            <p class="legal-date" id="lessonMeta"></p>
            <p id="lessonSummary"></p>

            <div id="objectivesArea" hidden>
                <h2>What you will learn</h2>
                <ul id="objectivesList"></ul>
            </div>

            <div class="lesson-content" id="lessonContent"></div>

            <p class="auth-message" id="lessonMessage" hidden></p>

            <div class="lesson-nav" id="lessonNav" hidden>
                <button type="button" id="completeButton">Mark as complete</button>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="lesson.js"></script>
</body>
</html>
